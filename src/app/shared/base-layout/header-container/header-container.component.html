<div class="menu">
  <img src="../../../assets/img/logo.png" alt="">
  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <a routerLink="/" routerLinkActive="active">
      <button mat-menu-item routerLink="/" routerLinkActive="active">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </button>
    </a>

    <a routerLink="/faq" routerLinkActive="active">
      <button mat-menu-item routerLink="/faq" routerLinkActive="active">
        <mat-icon>help_outline</mat-icon>
        <span>FAQ</span>
      </button>
    </a>

    <a [routerLink]="['/login']" routerLinkActive="active">
      <button mat-menu-item routerLink="/login" routerLinkActive="active">
        <mat-icon>account_circle</mat-icon>
        <span>Login</span>
      </button>
    </a>
  </mat-menu>
</div>
